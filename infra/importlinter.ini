[importlinter]
root_package = erp_core
include_external_packages = False

[importlinter:contract:shared_no_domain_imports]
name = Shared module must not depend on any domain module
type = forbidden
source_modules =
    erp_core.shared
forbidden_modules =
    erp_core.tenancy
    erp_core.channels
    erp_core.identity
    erp_core.catalog
    erp_core.crm
    erp_core.orders
    erp_core.finance
    erp_core.ai_engine
    erp_core.billing

[importlinter:contract:tenancy_is_foundational]
name = Tenancy module must not depend on downstream business modules
type = forbidden
source_modules =
    erp_core.tenancy
forbidden_modules =
    erp_core.channels
    erp_core.identity
    erp_core.catalog
    erp_core.crm
    erp_core.orders
    erp_core.finance
    erp_core.ai_engine
    erp_core.billing

[importlinter:contract:billing_isolated]
name = Billing module must not import downstream domain internals
type = forbidden
source_modules =
    erp_core.billing
forbidden_modules =
    erp_core.channels
    erp_core.identity
    erp_core.catalog
    erp_core.crm
    erp_core.orders
    erp_core.finance
    erp_core.ai_engine

[importlinter:contract:identity_isolated]
name = Identity module must not import ERP, channel, billing, or AI modules
type = forbidden
source_modules =
    erp_core.identity
forbidden_modules =
    erp_core.channels
    erp_core.catalog
    erp_core.crm
    erp_core.orders
    erp_core.finance
    erp_core.ai_engine
    erp_core.billing

[importlinter:contract:catalog_isolated]
name = Catalog module must not import downstream order, finance, or AI modules
type = forbidden
source_modules =
    erp_core.catalog
forbidden_modules =
    erp_core.channels
    erp_core.identity
    erp_core.crm
    erp_core.orders
    erp_core.finance
    erp_core.ai_engine
    erp_core.billing

[importlinter:contract:domain_modules_never_import_ai_engine]
name = Core ERP and tenancy domains must never import ai_engine
type = forbidden
source_modules =
    erp_core.tenancy
    erp_core.identity
    erp_core.catalog
    erp_core.crm
    erp_core.orders
    erp_core.finance
    erp_core.billing
forbidden_modules =
    erp_core.ai_engine
