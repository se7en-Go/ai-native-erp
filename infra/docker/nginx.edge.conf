# ai-native-erp — host-level Nginx reference for a cloud VM (Alibaba Cloud ECS,
# Tencent CVM, AWS EC2, any VPS) terminating TLS in front of the compose stack.
#
# Not used by docker compose: install it on the HOST so certificates and rate
# limits stay outside the application images.
#
#   sudo cp infra/docker/nginx.edge.conf /etc/nginx/conf.d/erp.conf
#   sudo certbot --nginx -d erp.example.com -d api.erp.example.com -d widget.erp.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every erp.example.com with your domain and confirm
# PROD_BIND_ADDRESS=127.0.0.1 in .env.prod so the containers are only reachable
# from this proxy.

# ---------------------------------------------------------------------------
# SSE / streaming: never buffer, never cache, never time out mid-conversation.
# Applied to the inbox stream on both the Next.js BFF and the FastAPI origin.
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Rate limiting for the public ingress (webhooks + widget) — tune per volume.
limit_req_zone $binary_remote_addr zone=erp_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=erp_webhook:10m rate=60r/s;

upstream erp_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream erp_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream erp_widget {
    server 127.0.0.1:3001;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com api.erp.example.com widget.erp.example.com;

    # ACME HTTP-01 challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Workbench (Next.js UI + Auth/BFF shell)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 25m;
    keepalive_timeout 75s;

    # ---- Inbox SSE through the Next.js BFF -------------------------------
    location = /api/bff/v1/inbox/stream {
        proxy_pass http://erp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming invariants — without these the agent inbox silently freezes.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    location /api/ {
        proxy_pass http://erp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://erp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# FastAPI origin (webhooks, widget API, /docs for operators)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 25m;

    # ---- Inbox SSE straight from FastAPI ---------------------------------
    location = /api/v1/inbox/stream {
        proxy_pass http://erp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    # ---- Channel webhooks: must answer <100ms, never rate-limit to death --
    location ~ ^/webhooks/ {
        limit_req zone=erp_webhook burst=120 nodelay;
        proxy_pass http://erp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=erp_api burst=60 nodelay;
        proxy_pass http://erp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# WebChat widget bundle (cross-origin; CORS comes from the widget container)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name widget.erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/widget.erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widget.erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://erp_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived immutable-ish cache is safe: the bundle name is stable but
        # the container sends max-age=300, must-revalidate.
        proxy_read_timeout 30s;
    }
}
