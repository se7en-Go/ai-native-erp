# Static host for the @erp/widget IIFE bundle (nginx:alpine, listen :3001).
#
# The bundle is loaded cross-origin from merchant storefronts (Shopify app
# embed block, custom themes), so CORS is intentionally open: the widget is
# public JavaScript, and all privileged calls are authenticated by the widget
# site key + HMAC, never by origin.

server {
    listen 3001;
    listen [::]:3001;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Container / load-balancer liveness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Canonical bundle name produced by `pnpm --filter @erp/widget build`
    # (and enforced by the CI gzip budget gate).
    location = /livechat-widget.iife.js {
        default_type application/javascript;
        access_log off;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        # Short TTL keeps embed fixes shippable within minutes while still
        # letting storefronts benefit from edge caching.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri =404;
    }

    # Back-compat alias probed by the deployment smoke test.
    location = /widget.iife.js {
        default_type application/javascript;
        access_log off;
        alias /usr/share/nginx/html/livechat-widget.iife.js;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cached (and typical) gzip probe path.
    location ~* \.(?:js|css|map)$ {
        default_type application/javascript;
        access_log off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
