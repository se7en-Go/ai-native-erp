# ai-native-erp — fully containerised production stack.
#
# Independent of the development stack in infra/docker-compose.yml (which CI and
# local development keep using). Nothing here is shared with it: different
# project name, different container names, different volumes, different ports.
#
#   cp .env.prod.example .env.prod   # then fill in the required secrets
#   docker compose -f infra/docker-compose.prod.yml \
#     --env-file .env.prod --profile demo-seed up -d --build
#
# Ports are bound to 127.0.0.1 by default so nothing is exposed to the public
# internet without an explicit reverse proxy (see infra/docker/nginx.edge.conf).
# Set PROD_BIND_ADDRESS=0.0.0.0 only on a firewalled host.

name: ai-native-erp-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared application configuration. Secrets come from the interpolated
# --env-file; nothing is baked into an image.
x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # DDL path: straight to Postgres (Alembic must not run through a
  # transaction pooler).
  DATABASE_MIGRATOR_URL: "postgresql+asyncpg://${APP_MIGRATOR_USER:-app_migrator}:${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-erp_saas}"
  # Runtime path: non-superuser app_runtime through PgBouncer transaction pool.
  DATABASE_RUNTIME_URL: "postgresql+asyncpg://${APP_RUNTIME_USER:-app_runtime}:${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in .env.prod}@pgbouncer:6432/${POSTGRES_DB:-erp_saas}"
  REDIS_URL: "redis://redis:6379/0"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET: ${S3_BUCKET:-erp-assets}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.prod}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.prod}
  S3_REGION: ${S3_REGION:-us-east-1}
  KMS_PROVIDER: ${KMS_PROVIDER:-local_aes}
  MASTER_KEK_HEX: ${MASTER_KEK_HEX:?set MASTER_KEK_HEX in .env.prod}
  KMS_KEY_ID: ${KMS_KEY_ID:-local-kek-v1}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  WHATSAPP_APP_ID: ${WHATSAPP_APP_ID:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
  TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
  TRACK17_API_KEY: ${TRACK17_API_KEY:-}
  TRACK17_WEBHOOK_SECRET: ${TRACK17_WEBHOOK_SECRET:-}
  SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
  SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
  TIKTOK_SHOP_APP_KEY: ${TIKTOK_SHOP_APP_KEY:-}
  TIKTOK_SHOP_APP_SECRET: ${TIKTOK_SHOP_APP_SECRET:-}
  ALLOW_LOCAL_WEBHOOK_URLS: ${ALLOW_LOCAL_WEBHOOK_URLS:-false}

services:
  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: erp_prod_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-erp_saas}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      APP_MIGRATOR_USER: ${APP_MIGRATOR_USER:-app_migrator}
      APP_RUNTIME_USER: ${APP_RUNTIME_USER:-app_runtime}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD in .env.prod}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in .env.prod}
    ports:
      # Default 5433: avoids the development stack on 5432/5433 and any other
      # local Postgres (e.g. an unrelated pentagi container).
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - erp_prod_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/10-init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-erp_saas}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: erp_prod_pgbouncer
    restart: unless-stopped
    logging: *default-logging
    # The image generates pgbouncer.ini + userlist.txt from DATABASE_URL, so no
    # plaintext credential is committed. Hex-only passwords keep this URL safe.
    environment:
      DATABASE_URL: "postgres://${APP_RUNTIME_USER:-app_runtime}:${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-erp_saas}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_RESET_QUERY: "DISCARD ALL"
      IGNORE_STARTUP_PARAMETERS: "extra_float_digits"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${PGBOUNCER_HOST_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: erp_prod_redis
    restart: unless-stopped
    logging: *default-logging
    # AOF on: raw_webhook_events are streamed through Redis and must survive a
    # restart. noeviction: never silently drop stream entries under pressure.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1"
      - --maxmemory-policy
      - noeviction
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - erp_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    # rustfs/rustfs is the verified anonymously pullable S3-compatible server
    # (quay.io/minio/minio rejects anonymous pulls). Service name stays `minio`
    # so S3_ENDPOINT_URL=http://minio:9000 is stable across environments.
    image: rustfs/rustfs:latest
    container_name: erp_prod_minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.prod}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.prod}
      RUSTFS_VOLUMES: /data
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${S3_HOST_PORT:-9000}:9000"
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - erp_prod_s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # -------------------------------------------------------------------------
  # One-shot jobs
  # -------------------------------------------------------------------------
  migrate:
    image: &backend-image "ai-native-erp/backend:${ERP_IMAGE_TAG:-prod}"
    container_name: erp_prod_migrate
    restart: "no"
    logging: *default-logging
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  seed:
    # Optional demo data. Production deployments simply never enable the
    # profile: `--profile demo-seed`.
    profiles: ["demo-seed"]
    image: *backend-image
    container_name: erp_prod_seed
    restart: "no"
    logging: *default-logging
    command: ["python", "scripts/seed_hybrid_factory.py", "--with-demo-data"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Application services
  # -------------------------------------------------------------------------
  backend:
    image: *backend-image
    container_name: erp_prod_backend
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    # HEALTHCHECK is defined in the image (GET /healthz).

  worker:
    image: *backend-image
    container_name: erp_prod_worker
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    command: ["python", "-m", "erp_core.worker_main"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # The worker exposes no port; liveness = the stream loop process is alive.
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import os,sys; sys.exit(0 if any(b'worker_main' in open(f'/proc/{p}/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: "ai-native-erp/web:${ERP_IMAGE_TAG:-prod}"
    container_name: erp_prod_web
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
        NEXT_PUBLIC_BACKEND_SSE_URL: ${NEXT_PUBLIC_BACKEND_SSE_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      # Runtime (not build-time) value: the BFF route handler reads it per
      # request, so the same image works in any environment.
      BFF_BACKEND_URL: ${BFF_BACKEND_URL:-http://backend:8000}
      NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"

  widget:
    image: "ai-native-erp/widget:${ERP_IMAGE_TAG:-prod}"
    container_name: erp_prod_widget
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ..
      dockerfile: infra/docker/widget.Dockerfile
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:${WIDGET_HOST_PORT:-3001}:3001"

volumes:
  erp_prod_pg_data:
    name: erp_prod_pg_data
  erp_prod_redis_data:
    name: erp_prod_redis_data
  erp_prod_s3_data:
    name: erp_prod_s3_data
