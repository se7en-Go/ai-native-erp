name: CI Gate

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

jobs:
  backend-and-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pass
          POSTGRES_DB: erp_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize PostgreSQL roles
        env:
          PGPASSWORD: postgres_dev_pass
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client netcat-openbsd
          psql -h 127.0.0.1 -U postgres -d erp_saas -f infra/postgres/init-roles.sql

      - name: Start PgBouncer container
        run: |
          cp infra/pgbouncer/pgbouncer.ini /tmp/pgbouncer-ci.ini
          sed -i 's/host=postgres/host=127.0.0.1/g' /tmp/pgbouncer-ci.ini
          docker run -d --name erp_pgbouncer --network host \
            -v "/tmp/pgbouncer-ci.ini:/etc/pgbouncer/pgbouncer.ini:ro" \
            -v "$PWD/infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro" \
            edoburu/pgbouncer:latest
          for i in $(seq 1 15); do nc -z 127.0.0.1 6432 && break; sleep 1; done

      - name: Wait for S3-compatible object storage
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/health && exit 0
            sleep 1
          done
          echo "S3 endpoint did not become ready" >&2
          exit 1

      - name: Install Python dependencies
        run: uv sync

      - name: Lint, typecheck, and verify module boundaries
        run: |
          uv run ruff check apps/backend
          uv run mypy apps/backend/src
          uv run lint-imports --config infra/importlinter.ini

      - name: Run Alembic migrations and pytest
        env:
          DATABASE_MIGRATOR_URL: postgresql+asyncpg://app_migrator:migrator_dev_pass@127.0.0.1:5432/erp_saas
          DATABASE_RUNTIME_URL: postgresql+asyncpg://app_runtime:runtime_dev_pass@127.0.0.1:6432/erp_saas
          REDIS_URL: redis://127.0.0.1:6379/0
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          S3_BUCKET: erp-assets
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          MASTER_KEK_HEX: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes
        run: |
          uv run --directory apps/backend alembic upgrade head
          uv run pytest -v

      - name: Verify zero OpenAPI contract drift
        run: |
          uv run python apps/backend/scripts/export_openapi.py
          git diff --exit-code contracts/openapi.json

  frontend-and-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Widget
        run: pnpm --filter widget build
      - name: Enforce Widget gzip size (< 35 KiB)
        shell: bash
        run: |
          set -euo pipefail
          artifact=apps/widget/dist/livechat-widget.iife.js
          bytes=$(gzip -c "$artifact" | wc -c)
          printf '%s: %d gzip bytes (must be < 35840)\n' "$artifact" "$bytes"
          if (( bytes >= 35840 )); then
            exit 1
          fi
      - name: Verify zero frontend OpenAPI SDK drift
        run: |
          pnpm --filter web openapi-ts
          git diff --exit-code apps/web/src/lib/api-client
          test -z "$(git ls-files --others --exclude-standard -- apps/web/src/lib/api-client)"
      - name: Lint Web (including zero business SQL)
        run: pnpm --filter web lint
      - name: Typecheck Web
        run: pnpm --filter web typecheck
      - name: Run Web unit tests
        run: pnpm --filter web test
      - name: Build Web for production
        run: pnpm --filter web build

  e2e-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Run mock E2E in Chromium
        env:
          E2E_MODE: mock
        run: pnpm --filter e2e run test --fail-on-flaky-tests
